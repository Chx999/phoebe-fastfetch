[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phoebe-fastfetch"
version = "0.1.0"
description = "Display random Phoebe Hub images alongside Fastfetch system information."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Chx999" },
]
dependencies = []

[project.scripts]
ff = "phoebe_fastfetch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
